name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build examples and handbook
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install TeX Live 2026
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2026
          packages: >
            scheme-small collection-xetex collection-latexextra
            collection-langchinese collection-fontsrecommended
            unicode-math tex-gyre-math gbt7714 latexmk
      - name: Build examples and handbook
        shell: bash
        run: make all
      - name: Check project fonts and fallback without system fonts
        run: |
          mkdir -p tmp/font-check
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=tmp/font-check tests/project-fonts.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=tmp/font-check tests/font-fallback.tex
          (
            cd templates/undergraduate-thesis
            xelatex -interaction=nonstopmode -halt-on-error -jobname=project-fonts-template -output-directory=../../tmp/font-check ../../tests/project-fonts.tex
          )
      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            suepthesis-doc.pdf
            templates/undergraduate-thesis/main.pdf
            templates/graduate-thesis/main.pdf
            templates/graduate-thesis/main-professional.pdf
            templates/doctoral-thesis/main.pdf
            templates/doctoral-thesis/main-professional.pdf
          if-no-files-found: error
          retention-days: 14
