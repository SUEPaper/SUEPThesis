name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build and zip templates
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install TeX Live 2026
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2026
          packages: >
            scheme-small collection-xetex collection-latexextra
            collection-langchinese collection-fontsrecommended
            unicode-math tex-gyre-math gbt7714 latexmk
      - name: Build examples and handbook
        run: ./scripts/build.ps1
      - name: Zip user files and example templates
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[A-Za-z0-9][A-Za-z0-9._-]*$') { throw 'Invalid release tag.' }
          $packageName = "SUEPThesis-$env:RELEASE_TAG"
          $packageRoot = Join-Path 'tmp/release' $packageName
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          $repoPath = (Get-Location).Path
          $files = @(
            'README.md', 'LICENSE', 'Makefile', 'scripts/build.ps1',
            'suepthesis.dtx', 'suepthesis-logo.dtx', 'suepthesis.ins',
            'suepthesis.cls', 'sueplogo.sty', 'suepthesis-doc.tex', 'suepthesis-doc.pdf'
          )
          $extensions = @('.tex', '.bib', '.cls', '.sty', '.md', '.png', '.jpg', '.jpeg', '.pdf', '.svg', '.doc', '.docx')
          $files += Get-ChildItem -LiteralPath templates,resources -Recurse -File |
            Where-Object { $_.Extension -in $extensions -or $_.Name -eq 'latexmkrc' } |
            ForEach-Object { [IO.Path]::GetRelativePath($repoPath, $_.FullName) }
          foreach ($file in $files) {
            $destination = Join-Path $packageRoot $file
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $file -Destination $destination
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath $packageRoot -DestinationPath "dist/$packageName.zip"
          Copy-Item -LiteralPath suepthesis-doc.pdf -Destination dist/suepthesis-doc.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/SUEPThesis-*.zip
            dist/suepthesis-doc.pdf
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload GitHub Release attachments
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Create release with ZIP and handbook
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--generate-notes', '--title', "SUEPThesis $env:RELEASE_TAG")
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += @('--prerelease', '--latest=false') }
          & gh @arguments "dist/SUEPThesis-$env:RELEASE_TAG.zip" dist/suepthesis-doc.pdf
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
